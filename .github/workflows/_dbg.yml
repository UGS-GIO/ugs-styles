name: dbg-assoc
on: pull_request
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      ASSOC: ${{ github.event.pull_request.author_association }}
      ULOGIN: ${{ github.event.pull_request.user.login }}
      UTYPE: ${{ github.event.pull_request.user.type }}
      DRAFT: ${{ github.event.pull_request.draft }}
      FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - run: |
          echo "assoc=[$ASSOC]"
          echo "ulogin=[$ULOGIN]"
          echo "utype=[$UTYPE]"
          echo "draft=[$DRAFT]"
          echo "fork=[$FORK]"
