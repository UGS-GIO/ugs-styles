name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:json
      - run: npm run gen:sprites
      - run: npm run build:esri
      # Each feature of the live GeoParquet drawn by GL vs by the derived Esri renderer, plus
      # unseen-value probes and synthetic edge cases. Fails on any difference not listed as known.
      - run: npm run oracle
