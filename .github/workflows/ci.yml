# Gate every PR on the same checks publish.yml runs, so a style that cannot compile is caught in
# review instead of at release. v0.1.34 was tagged with four styles that failed `tsc` — the tag's
# publish died before the GCS sync, so the CDN silently kept serving the previous manifest and the
# new legends never reached the map. Nothing ran typecheck until then; this is that missing gate.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:json
      - run: npm run gen:sprites
      # `validate` reads the live GeoParquet. Field drift fails, value/case drift warns — same
      # contract as the release gate, so a PR cannot merge a style that keys on a dead column.
      - run: npm run validate
